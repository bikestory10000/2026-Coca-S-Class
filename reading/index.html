<style>

*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:400 15px/1.6 var(--sans);word-break:keep-all}
header{background:var(--paper);border-bottom:1px solid var(--rule)}
.in{max-width:900px;margin:0 auto;padding:0 20px}
header .in{height:56px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em}.brand b{font-family:var(--serif);color:var(--pen);margin:0 2px}
.by{font-size:12.5px;color:var(--pencil)}

.sub{margin:0 0 22px;color:var(--pencil)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.item{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px 20px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;text-decoration:none;color:inherit}
a.item:hover{border-color:var(--ink-2)}a.item:hover .no{color:var(--pen)}
.no{grid-row:1/3;font:600 30px/1 var(--serif);align-self:center}
.t{font:600 18px/1.3 var(--serif)}
.d{font-size:13.5px;color:var(--pencil)}
.pdf{margin:6px 4px 0;font-size:13px;color:var(--pencil)}.pdf a{color:var(--pen)}
footer{margin:40px auto;font-size:13px;color:var(--pencil)}
</style>
